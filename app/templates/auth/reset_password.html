{% extends "base.html" %}
{% block title %}Nova senha | Apex Food{% endblock %}
{% block content %}
<section class="auth-saas">
    <div class="auth-form-panel">
        {% include "_flash.html" %}
        <a class="public-brand" href="{{ url_for('index') }}"><span class="brand-mark">A</span><span>Apex Food</span></a>
        <h1>Definir nova senha</h1>
        <form method="post" class="form-grid">
            <label>Nova senha<input name="password" type="password" minlength="6" required></label>
            <label>Confirmar senha<input name="password_confirm" type="password" minlength="6" required></label>
            <button class="btn primary" type="submit">Atualizar senha</button>
        </form>
    </div>
</section>
{% endblock %}
