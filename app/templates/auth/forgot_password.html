{% extends "base.html" %}
{% block title %}Recuperar senha | Apex Food{% endblock %}
{% block content %}
<section class="auth-saas">
    <div class="auth-form-panel">
        {% include "_flash.html" %}
        <a class="public-brand" href="{{ url_for('index') }}"><span class="brand-mark">A</span><span>Apex Food</span></a>
        <h1>Recuperar senha</h1>
        <p>Informe seu e-mail. Se encontrarmos uma conta, enviaremos as instru&ccedil;&otilde;es.</p>
        <form method="post" class="form-grid">
            <label>E-mail<input name="email" type="email" required></label>
            <button class="btn primary" type="submit">Enviar instru&ccedil;&otilde;es</button>
        </form>
        <p class="auth-link"><a href="{{ url_for('auth.login') }}">Voltar ao login</a></p>
    </div>
</section>
{% endblock %}
