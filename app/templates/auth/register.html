{% extends "base.html" %}
{% block title %}Cadastro | Apex Food{% endblock %}
{% block content %}
<section class="auth-card register-card">
    <div class="brand auth-brand">
        <span class="brand-mark">AF</span>
        <span>
            <strong>Apex Food</strong>
            <small>Crie sua operação</small>
        </span>
    </div>
    <h1>Cadastrar empresa</h1>
    <form method="post" class="form-grid two-columns">
        <label>Nome da empresa<input name="legal_name" required></label>
        <label>Nome fantasia<input name="trade_name" required></label>
        <label>CNPJ<input name="cnpj" required></label>
        <label>E-mail<input name="email" type="email" required></label>
        <label>Telefone<input name="phone" required></label>
        <label>Segmento
            <select name="segment" required>
                {% for segment in segments %}
                <option value="{{ segment }}">{{ segment }}</option>
                {% endfor %}
            </select>
        </label>
        <label class="span-2">Endereço<input name="address" required></label>
        <label>Cidade<input name="city" required></label>
        <label>Estado<input name="state" maxlength="2" required></label>
        <label>CEP<input name="cep" required></label>
        <label>Nome do administrador<input name="admin_name" required></label>
        <label>E-mail do administrador<input name="admin_email" type="email" required></label>
        <label>Senha<input name="password" type="password" required></label>
        <button class="btn primary span-2" type="submit">Criar empresa</button>
    </form>
    <p class="auth-link"><a href="{{ url_for('auth.login') }}">Voltar para login</a></p>
</section>
{% endblock %}
